{% extends "base.html" %}
{% block title %}Page not found – {{ site.name }}{% endblock %}
{% block content %}
<section class="section text-center not-found">
  <div class="container">
    <i class="fa-solid fa-compass fa-4x text-accent mb-4"></i>
    <h1 class="display-6 fw-bold">Looks like you're off the trail</h1>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-dark me-2">Go home</a>
    <a href="{{ url_for('tours') }}" class="btn btn-accent">Browse treks</a>
  </div>
</section>
{% endblock %}
