# Render.com deployment (free plan). Add secrets (SMTP, Razorpay, GA) in the Render dashboard.
services:
  - type: web
    name: shivneri-trekkers
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
